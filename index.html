.hr{display:flex;gap:8px;align-items:center}
.pill{font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
.ib:hover{border-color:var(--ac)}
main{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:clamp(20px,4vw,48px);animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ft{text-align:center;color:var(--mut);font-size:13px;padding:20px 16px;border-top:1px solid var(--bd)}
.ft a{color:var(--ac);font-weight:600;text-decoration:none}.ft a:hover{text-decoration:underline}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);background:rgba(91,91,240,.12);padding:6px 12px;border-radius:99px}
h1{font-size:clamp(32px,5.5vw,60px);line-height:1.05;margin:18px 0 14px;letter-spacing:-.03em}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mut);line-height:1.65;font-size:17px;margin:0 0 20px}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:10px;color:var(--tx);font-size:15px}
.feat li:before{content:"✓";color:var(--ok);font-weight:800;margin-right:10px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:22px 0 10px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;min-height:calc(100dvh - 210px)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh);padding:clamp(20px,3vw,34px)}
.panel h3:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:100px;padding:13px 14px;border-radius:14px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.chip small{display:block;font-weight:500;font-size:12px;color:var(--mut);margin-top:3px}
.chip:hover{border-color:var(--ac)}
.chip.on{border-color:var(--ac);background:rgba(91,91,240,.12);color:var(--ac)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cats .chip{text-align:left}.cats .chip i{font-style:normal;font-size:22px;display:block;margin-bottom:4px}
.btn{display:block;width:100%;margin-top:26px;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(91,91,240,.35);transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.qz{display:grid;grid-template-columns:1fr 290px;gap:clamp(20px,3vw,40px);align-items:start}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mut);font-weight:600;margin-bottom:12px}
.link{background:none;border:0;color:var(--mut);font:600 14px inherit;font-family:inherit;cursor:pointer}.link:hover{color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .3s}
.meta{font-size:13px;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
.q{font-size:clamp(22px,3vw,32px);line-height:1.3;font-weight:750;margin:10px 0 26px;letter-spacing:-.01em}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:17px 18px;margin-bottom:12px;border-radius:16px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:500 17px/1.4 inherit;font-family:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(4px)}
.opt b{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bd);font-size:13px}
.opt.sel{border-color:var(--ac);background:rgba(91,91,240,.1)}.opt.sel b{background:var(--ac);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.nav2{display:flex;gap:12px}.nav2 .btn{margin-top:14px}.nav2 .btn.ghost{flex:0 0 140px}
.side{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;position:sticky;top:20px}
.side h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.dot{height:38px;border-radius:10px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:600 13px inherit;font-family:inherit;cursor:pointer}
.dot.ans{background:rgba(91,91,240,.15);border-color:var(--ac)}
.dot.ok{background:var(--okb);border-color:var(--ok)}.dot.bad{background:var(--badb);border-color:var(--bad)}
.dot.cur{outline:3px solid var(--ac2);outline-offset:1px}
.resg{display:grid;grid-template-columns:380px 1fr;gap:clamp(20px,4vw,56px);align-items:start}
.res{text-align:center}
.ring{width:190px;height:190px;margin:14px auto;border-radius:50%;display:grid;place-items:center}
.ring div{width:152px;height:152px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:42px;font-weight:800}
.verdict{font-size:26px;font-weight:800;margin:6px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;font-size:12px;color:var(--mut)}
.stats b{display:block;font-size:20px;color:var(--tx);margin-bottom:2px}
.cb{margin-bottom:14px;font-size:14px;font-weight:600}
.cb span{display:flex;justify-content:space-between;margin-bottom:6px}
.cb i{display:block;height:9px;border-radius:9px;background:var(--bd);overflow:hidden}.cb i u{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.rev{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px 18px;margin-top:10px;line-height:1.5}
.rev small{display:block;margin-top:6px;font-size:14px}.rev .w{color:var(--bad)}.rev .g{color:var(--ok)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:16px}
@media (max-width:900px){.hero,.qz,.resg{grid-template-columns:1fr}.hero{min-height:0}.side{position:static}.nav2 .btn.ghost{flex-basis:110px}}
</style>

const $=s=>document.querySelector(s),root=$('#root');
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ICON={'Sprzęt':'🖥️','Sieci':'🌐','Systemy':'🐧','Bezpieczeństwo':'🔒'};
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null};
const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
let cfg={n:10,cat:'Wszystkie',mode:'learn'},S,tmr;
const showBest=()=>{const b=store('inf02best');$('#best').textContent='🏆 Rekord: '+(b?b+'%':'—')};
const tick=()=>{clearInterval(tmr);const u=()=>{const e=$('#tm');if(e&&S)e.textContent=fmt((Date.now()-S.t0)/1000|0)};tmr=setInterval(u,1000)};
const pick1=(el,key,val)=>{cfg[key]=val;start()};
 
function start(){
 clearInterval(tmr);S=null;showBest();
 const cnt=c=>c=='Wszystkie'?Q.length:Q.filter(q=>q[0]==c).length;
 const cats=['Wszystkie',...Object.keys(ICON)];
 root.innerHTML=`<section class="hero"><div>
 <span class="badge">INF.02 · ${Q.length} PYTAŃ W BAZIE</span>
 <h1>Przygotuj się do egzaminu <span>INF.02</span></h1>
 <p class="lead">Administracja i eksploatacja systemów komputerowych, urządzeń peryferyjnych i lokalnych sieci komputerowych. Ćwicz na losowych pytaniach i śledź swoje postępy.</p>
 <ul class="feat"><li>Losowe pytania i losowa kolejność odpowiedzi</li><li>Tryb nauki z natychmiastową podpowiedzią lub tryb egzaminu</li><li>Nawigacja po pytaniach, stoper i seria poprawnych odpowiedzi</li><li>Powtórka tylko błędnych pytań i wynik w podziale na działy</li></ul></div>
 <div class="panel"><h3>Liczba pytań</h3><div class="row" id="n">${[10,20,40].map(n=>`<button class="chip ${cfg.n==n?'on':''}" data-v="${n}">${n} pytań</button>`).join('')}</div>
 <h3>Tryb</h3><div class="row" id="m"><button class="chip ${cfg.mode=='learn'?'on':''}" data-v="learn">Nauka<small>poprawna odpowiedź od razu</small></button><button class="chip ${cfg.mode=='exam'?'on':''}" data-v="exam">Egzamin<small>wynik dopiero na końcu</small></button></div>
 <h3>Zagadnienia</h3><div class="cats" id="c">${cats.map(c=>`<button class="chip ${cfg.cat==c?'on':''}" data-v="${c}"><i>${ICON[c]||'📚'}</i>${c}<small>${cnt(c)} pytań</small></button>`).join('')}</div>
 <button class="btn" id="go">Rozpocznij test →</button>
 <p class="hint">Próg zaliczenia: 50% · Klawisze: 1–4 odpowiedź, ← → nawigacja</p></div></section>`;
 const bind=(id,key,conv)=>$(id).onclick=e=>{const b=e.target.closest('[data-v]');if(b){cfg[key]=conv?+b.dataset.v:b.dataset.v;start()}};
 bind('#n','n',1);bind('#m','mode');bind('#c','cat');
 $('#go').onclick=begin;
}
function begin(){
 const pool=Q.filter(q=>cfg.cat=='Wszystkie'||q[0]==cfg.cat);
 launch(shuf(pool).slice(0,cfg.n).map(q=>{const o=shuf(q.slice(2));return{cat:q[0],t:q[1],o,ci:o.indexOf(q[2])}}));
}
function launch(qs){S={qs,i:0,a:[],st:0,bst:0,t0:Date.now(),mode:cfg.mode};tick();show()}
function show(){
 const q=S.qs[S.i],n=S.qs.length,a=S.a[S.i],learn=S.mode=='learn',rev=learn&&a!=null;
 const done=S.a.filter(x=>x!=null).length;
 const dc=j=>{const x=S.a[j];return (j==S.i?'cur ':'')+(x==null?'':learn?(x==S.qs[j].ci?'ok':'bad'):'ans')};
 root.innerHTML=`<div class="qz"><section>
 <div class="top"><button class="link" id="quit">✕ Przerwij</button><span>⏱ <b id="tm">${fmt((Date.now()-S.t0)/1000|0)}</b></span><span>${learn?'🔥 Seria: '+S.st:'Tryb egzaminu'}</span></div>
 <div class="bar"><i style="width:${done/n*100}%"></i></div>
 <div class="meta">Pytanie ${S.i+1} z ${n} · ${q.cat}</div>
 <h2 class="q">${q.t}</h2>
 ${q.o.map((o,k)=>`<button class="opt ${rev?(k==q.ci?'ok':k==a?'bad':''):(k==a?'sel':'')}" data-k="${k}" ${rev?'disabled':''}><b>${k+1}</b><span>${o}</span></button>`).join('')}
 <div class="nav2"><button class="btn ghost" id="pv" ${S.i?'':'disabled'}>← Wstecz</button><button class="btn" id="nx">${S.i==n-1?'Zakończ test':'Dalej →'}</button></div>
 </section><aside class="side"><h3>Pytania (${done}/${n})</h3><div class="grid">${S.qs.map((_,j)=>`<button class="dot ${dc(j)}" data-j="${j}">${j+1}</button>`).join('')}</div></aside></div>`;
 root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 root.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;show()});
 $('#pv').onclick=()=>{S.i--;show()};
 $('#nx').onclick=()=>S.i==n-1?finish():(S.i++,show());
 $('#quit').onclick=()=>{if(confirm('Przerwać test? Postęp zostanie utracony.'))start()};
}
function pick(k){
 if(S.mode=='learn'&&S.a[S.i]!=null)return;
 S.a[S.i]=k;
 if(S.mode=='learn'){const ok=k==S.qs[S.i].ci;S.st=ok?S.st+1:0;S.bst=Math.max(S.bst,S.st)}
 show();$('#nx').focus();
}
function finish(){
 const miss=S.qs.length-S.a.filter(x=>x!=null).length;
 if(miss&&!confirm('Pytania bez odpowiedzi: '+miss+'. Zakończyć test?'))return;
 clearInterval(tmr);result();
}
function result(){
 const n=S.qs.length,secs=(Date.now()-S.t0)/1000|0,wrong=[],cs={};let score=0;
 S.qs.forEach((q,i)=>{const a=S.a[i];cs[q.cat]=cs[q.cat]||[0,0];cs[q.cat][1]++;
  if(a==q.ci){score++;cs[q.cat][0]++}else wrong.push({q,y:a==null?'— brak odpowiedzi —':q.o[a]})});
 const p=Math.round(score/n*100),pass=p>=50,col=pass?'var(--ok)':'var(--bad)';
 store('inf02best',Math.max(p,+store('inf02best')||0));showBest();
 const label=p>=90?'Znakomicie! 🏆':p>=75?'Bardzo dobrze 🎉':pass?'Zaliczone ✅':'Jeszcze nie tym razem';
 root.innerHTML=`<div class="resg"><div class="panel res"><span class="badge">WYNIK</span>
 <div class="ring" style="background:conic-gradient(${col} ${p*3.6}deg,var(--bd) 0)"><div>${p}%</div></div>
 <div class="verdict" style="color:${col}">${label}</div>
 <p class="lead" style="margin:0">Poprawne odpowiedzi: ${score} z ${n}</p>
 <div class="stats"><div><b>${fmt(secs)}</b>czas</div><div><b>${S.mode=='learn'?S.bst:'–'}</b>najdłuższa seria</div><div><b>${store('inf02best')}%</b>rekord</div></div>
 ${wrong.length?`<button class="btn" id="rt">Powtórz tylko błędne (${wrong.length})</button>`:''}
 <button class="btn ${wrong.length?'ghost':''}" id="again" style="margin-top:12px">Nowy test</button>
 <button class="btn ghost" id="menu" style="margin-top:12px">Zmień ustawienia</button></div>
 <div><h3 style="margin-top:0">Wynik według działów</h3>${Object.entries(cs).map(([c,v])=>`<div class="cb"><span><em style="font-style:normal">${ICON[c]||''} ${c}</em><em style="font-style:normal">${v[0]}/${v[1]}</em></span><i><u style="width:${v[0]/v[1]*100}%"></u></i></div>`).join('')}
 ${wrong.length?`<h3>Do powtórki (${wrong.length})</h3>`+wrong.map(w=>`<div class="rev"><b>${w.q.t}</b><small class="w">Twoja odpowiedź: ${w.y}</small><small class="g">Poprawna: ${w.q.o[w.q.ci]}</small></div>`).join(''):'<p class="lead">Bezbłędnie – świetna robota!</p>'}</div></div>`;
 $('#again').onclick=begin;$('#menu').onclick=start;
 if(wrong.length)$('#rt').onclick=()=>launch(shuf(wrong.map(w=>{const q=w.q,c=q.o[q.ci],o=shuf(q.o);return{cat:q.cat,t:q.t,o,ci:o.indexOf(c)}})));
}
document.addEventListener('keydown',e=>{
 if(!S||!$('.opt'))return;
 if(e.key>='1'&&e.key<='4')pick(+e.key-1);
 else if(e.key=='ArrowRight'&&S.i<S.qs.length-1){S.i++;show()}
 else if(e.key=='ArrowLeft'&&S.i>0){S.i--;show()}
});
$('#th').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur=='dark'?'light':'dark';d.dataset.theme=nx;store('inf02theme',nx)};
$('#fs').onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{})}catch(e){}};
const th=store('inf02theme');if(th)document.documentElement.dataset.theme=th;
start();
</script>
</body>
</html>

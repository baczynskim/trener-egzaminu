*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center;padding:24px 16px;background-image:radial-gradient(600px 300px at 10% -5%,rgba(91,91,240,.18),transparent),radial-gradient(500px 300px at 100% 0,rgba(139,92,246,.15),transparent);background-attachment:fixed}
.app{width:100%;max-width:720px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:32px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ac);background:rgba(91,91,240,.12);padding:6px 12px;border-radius:99px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:16px 0 10px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.lead{color:var(--mut);line-height:1.6;margin:0 0 24px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chip{flex:1;min-width:110px;padding:14px 16px;border-radius:14px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:600 15px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{border-color:var(--ac);background:rgba(91,91,240,.12);color:var(--ac)}
.btn{display:block;width:100%;margin-top:28px;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(91,91,240,.35);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mut);font-weight:600;margin-bottom:12px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:26px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .3s}
.q{font-size:clamp(19px,4vw,23px);line-height:1.4;font-weight:700;margin:8px 0 22px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;border-radius:14px;border:2px solid var(--bd);background:transparent;color:var(--tx);font:500 16px/1.4 inherit;font-family:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(3px)}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--bd);font-size:13px}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}
.opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.ring{width:170px;height:170px;margin:10px auto 6px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring div{width:134px;height:134px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:36px;font-weight:800}
.res{text-align:center}
.verdict{font-size:22px;font-weight:800;margin:10px 0 4px}
.rev{border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15px;line-height:1.5}
.rev small{display:block;margin-top:6px}
.rev .w{color:var(--bad)}.rev .g{color:var(--ok)}
.hint{color:var(--mut);font-size:13px;text-align:center;margin-top:16px}
</style>
</head>

 root.innerHTML=`<span class="badge">INF.02</span>
 <h1>Trener egzaminu <span>INF.02</span></h1>
 <p class="lead">Administracja i eksploatacja systemów komputerowych, urządzeń peryferyjnych i sieci lokalnych. Pytania losowe, odpowiedzi w losowej kolejności, natychmiastowa informacja zwrotna.</p>
 <h3>Liczba pytań</h3><div class="row" id="n">${[10,20,40].map(n=>`<button class="chip ${cfg.n==n?'on':''}" data-v="${n}">${n} pytań</button>`).join('')}</div>
 <h3>Zagadnienia</h3><div class="row" id="c">${cats.map(c=>`<button class="chip ${cfg.cat==c?'on':''}" data-v="${c}">${c}</button>`).join('')}</div>
 <button class="btn" id="go">Rozpocznij test</button>
 <p class="hint">Próg zaliczenia: 50% · W teście: klawisze 1–4 i Enter</p>`;
 $('#n').onclick=e=>{if(e.target.dataset.v){cfg.n=+e.target.dataset.v;start()}};
 $('#c').onclick=e=>{if(e.target.dataset.v){cfg.cat=e.target.dataset.v;start()}};
 $('#go').onclick=begin;
}
function begin(){
 const pool=Q.filter(q=>cfg.cat=='Wszystkie'||q[0]==cfg.cat);
 const qs=shuf(pool).slice(0,cfg.n).map(q=>({cat:q[0],t:q[1],c:q[2],o:shuf(q.slice(2))}));
 S={qs,i:0,score:0,wrong:[],done:false,t0:Date.now()};show();
}
function show(){
 const q=S.qs[S.i],n=S.qs.length;S.done=false;
 root.innerHTML=`<div class="top"><span>Pytanie ${S.i+1} z ${n}</span><span>${q.cat} · ⏱ <span id="tm"></span></span></div>
 <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="q">${q.t}</div>
 ${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><b>${k+1}</b><span>${o}</span></button>`).join('')}
 <button class="btn" id="nx" disabled>${S.i==n-1?'Zakończ test':'Dalej'}</button>`;
 root.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 $('#nx').onclick=next;clearInterval(tmr);const u=()=>{const e=$('#tm');if(e)e.textContent=fmt((Date.now()-S.t0)/1000|0)};u();tmr=setInterval(u,1000);
}
function pick(k){
 if(S.done)return;S.done=true;
 const q=S.qs[S.i],ok=q.o[k]==q.c;
 root.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.o[j]==q.c)b.classList.add('ok');else if(j==k)b.classList.add('bad')});
 if(ok)S.score++;else S.wrong.push({t:q.t,y:q.o[k],c:q.c,q});
 $('#nx').disabled=false;$('#nx').focus();
}
function next(){S.i++;S.i>=S.qs.length?result():show()}
let tmr;const fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
function rec(p){let b=p;try{b=Math.max(p,+localStorage.getItem('inf02best')||0);localStorage.setItem('inf02best',b)}catch(e){}return b}
function retry(){S={qs:S.wrong.map(w=>({...w.q,o:shuf(w.q.o)})),i:0,score:0,wrong:[],done:false,t0:Date.now()};show()}
function result(){clearInterval(tmr);
 const n=S.qs.length,p=Math.round(S.score/n*100),pass=p>=50,col=pass?'var(--ok)':'var(--bad)';
 root.innerHTML=`<div class="res"><span class="badge">WYNIK</span>
 <div class="ring" style="background:conic-gradient(${col} ${p*3.6}deg,var(--bd) 0)"><div>${p}%</div></div>
 <div class="verdict" style="color:${col}">${pass?'Zaliczone 🎉':'Jeszcze nie tym razem'}</div>
 <p class="lead">Poprawne odpowiedzi: ${S.score} z ${n} · czas ${fmt((Date.now()-S.t0)/1000|0)}<br>🏆 Twój rekord: ${rec(p)}%</p></div>
 ${S.wrong.length?`<h3>Do powtórki (${S.wrong.length})</h3>`+S.wrong.map(w=>`<div class="rev"><b>${w.t}</b><small class="w">Twoja odpowiedź: ${w.y}</small><small class="g">Poprawna: ${w.c}</small></div>`).join(''):'<p class="lead" style="text-align:center">Bezbłędnie – świetna robota!</p>'}
 ${S.wrong.length?'<button class="btn" id="rt">Powtórz tylko błędne ('+S.wrong.length+')</button>':''}
 <button class="btn ${S.wrong.length?'ghost':''}" id="again" ${S.wrong.length?'style="margin-top:12px"':''}>Nowy test</button>
 <button class="btn ghost" id="menu" style="margin-top:12px">Zmień ustawienia</button>`;
 $('#again').onclick=begin;if(S.wrong.length)$('#rt').onclick=retry;$('#menu').onclick=start;
}
document.addEventListener('keydown',e=>{
 if(!S||!$('.opt'))return;
 if(e.key>='1'&&e.key<='4'){pick(+e.key-1)}
 else if(e.key=='Enter'&&S.done){e.preventDefault();next()}
});
start();
</script>
</body>
</html>
